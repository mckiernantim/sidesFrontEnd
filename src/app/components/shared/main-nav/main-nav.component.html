<nav class="sw-nav">
  <div class="sw-nav-inner">
    <a [routerLink]="['/']" class="sw-logo" (click)="closeMobileMenu()">
      <img
        class="sw-logo-mark"
        src="assets/brand/hero-bot.jpeg"
        width="28"
        height="28"
        alt=""
        aria-hidden="true"
      />
      SIDES<span class="bolt">⚡</span>WAYS<span class="marker">~&gt;~&gt;</span>
    </a>

    <div class="sw-nav-links">
      <a routerLink="/how-it-works" routerLinkActive="active">How it works</a>
      <a routerLink="/pricing" routerLinkActive="active">Pricing</a>
      <a routerLink="/about" routerLinkActive="active">About</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
    </div>

    <div class="sw-nav-user">
      <button
        type="button"
        class="theme-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.title]="isDarkTheme ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <svg *ngIf="!isDarkTheme" class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"></path>
        </svg>
        <svg *ngIf="isDarkTheme" class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"></path>
        </svg>
      </button>

      <div *ngIf="currentScriptName && isLoggedIn" class="sw-script-badge" [title]="currentScriptName">
        <span class="sw-script-badge-label">Script</span>
        <span class="sw-script-badge-name">{{ currentScriptName }}</span>
      </div>

      <ng-container *ngIf="!isLoggedIn; else loggedInTemplate">
        <button type="button" (click)="signIn()" class="sw-login-btn sw-login-desktop">Login</button>
      </ng-container>

      <ng-template #loggedInTemplate>
        <div class="sw-user-menu" (click)="toggleUserMenu(); $event.stopPropagation()" (clickOutside)="closeUserMenu()">
          <button type="button" class="sw-user-trigger" aria-haspopup="true" [attr.aria-expanded]="isUserMenuOpen">
            <span class="sw-avatar-wrap">
              <img
                *ngIf="userAvatar; else letterAvatar"
                [src]="userAvatar"
                alt="User avatar"
                class="sw-avatar-img"
              />
              <ng-template #letterAvatar>
                <span class="sw-avatar">{{ (username || 'U').charAt(0) | uppercase }}</span>
              </ng-template>
              <span
                *ngIf="isFounder"
                class="founder-avatar-check"
                title="Founder"
                aria-label="Founder"
              >
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-2.5 h-2.5">
                  <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
              </span>
            </span>
            <span class="sw-username">{{ username }}</span>
            <span class="sw-chevron">↓</span>
          </button>

          <div *ngIf="isUserMenuOpen" class="sw-user-dropdown">
            <a [routerLink]="['/profile']">Profile</a>
            <a [routerLink]="['/settings']">Settings</a>
            <a (click)="logout()">Logout</a>
          </div>
        </div>
      </ng-template>

      <button
        type="button"
        class="sw-mobile-toggle"
        (click)="toggleMobileMenu($event)"
        [attr.aria-label]="isMobileMenuOpen ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-controls="sw-mobile-menu"
      >
        <svg *ngIf="!isMobileMenuOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg *ngIf="isMobileMenuOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
</nav>

<!-- Fixed overlay menu (outside overflow-clipped nav) -->
<div
  *ngIf="isMobileMenuOpen"
  class="sw-mobile-backdrop"
  (click)="closeMobileMenu()"
  aria-hidden="true"
></div>

<div
  *ngIf="isMobileMenuOpen"
  id="sw-mobile-menu"
  class="sw-mobile-menu"
  role="navigation"
  aria-label="Mobile"
>
  <a routerLink="/" (click)="closeMobileMenu()">Home</a>
  <a routerLink="/how-it-works" (click)="closeMobileMenu()">How it works</a>
  <a routerLink="/pricing" (click)="closeMobileMenu()">Pricing</a>
  <a routerLink="/about" (click)="closeMobileMenu()">About</a>
  <a routerLink="/contact" (click)="closeMobileMenu()">Contact</a>

  <div class="sw-mobile-divider" aria-hidden="true"></div>

  <ng-container *ngIf="isLoggedIn; else mobileLogin">
    <p *ngIf="username" class="sw-mobile-user-label">{{ username }}</p>
    <a [routerLink]="['/profile']" (click)="closeMobileMenu()">Profile</a>
    <a [routerLink]="['/settings']" (click)="closeMobileMenu()">Settings</a>
    <button type="button" class="sw-mobile-logout" (click)="logout()">Logout</button>
  </ng-container>
  <ng-template #mobileLogin>
    <button type="button" class="sw-mobile-login" (click)="signIn(); closeMobileMenu()">Login</button>
  </ng-template>
</div>
