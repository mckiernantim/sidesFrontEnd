<!-- ══ Mobile card list (< md) ══ -->
<div class="sw-card-list" role="list">
  <button
    type="button"
    class="sw-scene-card"
    *ngFor="let item of sortedData"
    role="listitem"
    [class.selected]="isSelected(item)"
    [attr.aria-pressed]="selectable ? isSelected(item) : null"
    (click)="selectable ? toggleSelection($event, item) : onRowClick(item)">

    <span *ngIf="selectable" class="sw-scene-card-check" aria-hidden="true">
      <input
        type="checkbox"
        tabindex="-1"
        [checked]="isSelected(item)"
        (click)="$event.stopPropagation(); toggleSelection($event, item)"
        class="sw-checkbox">
    </span>

    <span class="sw-scene-card-badge" *ngIf="badgeColumns.length">
      <ng-container *ngFor="let column of badgeColumns">
        {{ cellValue(item, column) }}
      </ng-container>
    </span>

    <span class="sw-scene-card-body">
      <span class="sw-scene-card-title">
        <ng-container *ngFor="let column of primaryColumns">
          {{ cellValue(item, column) }}
        </ng-container>
        <ng-container *ngIf="primaryColumns.length === 0 && columns[0]">
          {{ cellValue(item, columns[0]) }}
        </ng-container>
      </span>
      <span class="sw-scene-card-meta" *ngIf="metaColumns.length">
        <ng-container *ngFor="let column of metaColumns; let i = index">
          <ng-container *ngIf="cellValue(item, column) as value">
            <span *ngIf="value" class="sw-scene-card-meta-item">
              <span *ngIf="i > 0" class="sw-scene-card-meta-sep"> · </span>
              <span class="sw-scene-card-meta-label">{{ column.header }}</span>
              {{ value }}
            </span>
          </ng-container>
        </ng-container>
      </span>
    </span>
  </button>

  <div *ngIf="data.length === 0" class="sw-scene-card-empty">
    No data available
  </div>
</div>

<!-- ══ Desktop table (≥ md) ══ -->
<div class="overflow-x-auto sw-table-wrap sw-table-desktop">
  <table class="min-w-full sw-table">
    <thead>
      <tr>
        <th *ngIf="selectable" class="w-10 px-4 py-2"></th>

        <th *ngFor="let column of columns"
            class="px-4 py-2 text-left text-sm font-medium uppercase tracking-wider cursor-pointer"
            (click)="sort(column.key)">
          {{ column.header }}
          <span *ngIf="sortColumn === column.key">
            {{ sortDirection === 'asc' ? '↑' : '↓' }}
          </span>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of sortedData"
          [class.selected]="isSelected(item)">
        <td *ngIf="selectable" class="w-10 px-4 py-2">
          <input type="checkbox"
                 [checked]="isSelected(item)"
                 (click)="toggleSelection($event, item)"
                 class="sw-checkbox">
        </td>
        <td *ngFor="let column of columns" class="px-4 py-2">
          <ng-container *ngIf="column.cell; else defaultCell">
            {{ column.cell(item) }}
          </ng-container>
          <ng-template #defaultCell>
            {{ item[column.key] }}
          </ng-template>
        </td>
      </tr>
      <tr *ngIf="data.length === 0">
        <td [attr.colspan]="columns.length + (selectable ? 1 : 0)" class="px-4 py-2 text-center empty">
          No data available
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="pagination && data.length > 0" class="sw-table-pager">
  <div class="pager-controls">
    <label class="pager-size">
      <span>Show</span>
      <select
        class="sw-input pager-size-select"
        [ngModel]="pageSize"
        (ngModelChange)="onPageSizeChange($event)">
        <option *ngFor="let size of pageSizeOptions" [ngValue]="size">
          {{ pageSizeLabel(size) }}
        </option>
      </select>
      <span>scenes</span>
    </label>
    <p class="pager-meta">
      Showing
      <span class="font-medium">{{ data.length === 0 ? 0 : startIndex + 1 }}</span>
      to
      <span class="font-medium">{{ endIndex }}</span>
      of
      <span class="font-medium">{{ data.length }}</span>
      results
    </p>
  </div>

  <div *ngIf="totalPages > 1" class="pager-nav-wrap">
    <div class="flex justify-between sm:hidden gap-2">
      <button type="button" [disabled]="currentPage === 1"
              (click)="goToPage(currentPage - 1)"
              class="btn-sw btn-sw-ghost"
              [ngClass]="{'opacity-50 cursor-not-allowed': currentPage === 1}">
        Previous
      </button>
      <button type="button" [disabled]="currentPage === totalPages"
              (click)="goToPage(currentPage + 1)"
              class="btn-sw btn-sw-ghost"
              [ngClass]="{'opacity-50 cursor-not-allowed': currentPage === totalPages}">
        Next
      </button>
    </div>
    <nav class="pager-nav hidden sm:inline-flex" aria-label="Pagination">
      <button type="button" [disabled]="currentPage === 1"
              (click)="goToPage(currentPage - 1)"
              [ngClass]="{'opacity-50 cursor-not-allowed': currentPage === 1}">
        <span class="sr-only">Previous</span>
        &laquo;
      </button>
      <ng-container *ngFor="let page of pageNumbers">
        <button type="button" (click)="goToPage(page + 1)"
                [class.active]="currentPage === page + 1">
          {{ page + 1 }}
        </button>
      </ng-container>
      <button type="button" [disabled]="currentPage === totalPages"
              (click)="goToPage(currentPage + 1)"
              [ngClass]="{'opacity-50 cursor-not-allowed': currentPage === totalPages}">
        <span class="sr-only">Next</span>
        &raquo;
      </button>
    </nav>
  </div>
</div>
