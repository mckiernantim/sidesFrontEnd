<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center px-4">
  <!-- Background overlay -->
  <div class="fixed inset-0 bg-black bg-opacity-50"></div>
  
  <!-- Centered container -->
  <div class="relative z-50 w-full max-w-lg mx-auto">
    <div class="sw-dialog-panel shadow-xl overflow-hidden">
      <!-- Content -->
      <div class="px-4 pt-5 pb-4 sm:p-6">
        <div class="text-center">
          <h3 *ngIf="title" class="text-lg font-semibold text-sw-text mb-4 font-display">
            {{ title }}
          </h3>
          <!-- Dynamic component container -->
          <ng-container #dynamicComponentContainer></ng-container>
          <!-- HTML content (fallback) -->
          <div *ngIf="!componentType" class="text-sw-text" [innerHTML]="safeContent"></div>
        </div>
      </div>
      
      <!-- Actions -->
      <div class="px-4 py-3 sm:px-6 flex flex-col-reverse sm:flex-row-reverse justify-center gap-3 border-t border-sw-border">
        <ng-container *ngFor="let action of actions">
          <button
            type="button"
            class="btn-sw w-full sm:w-auto"
            [class.btn-sw-primary]="action.style === 'primary' || action.style === 'danger'"
            [class.btn-sw-ghost]="action.style === 'secondary' || !action.style"
            (click)="onAction(action.value)"
          >
            {{ action.label }}
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</div>
<div *ngIf="isOpen && !disableClose" class="fixed inset-0 z-40 bg-black opacity-40" (click)="onClose()"></div>
