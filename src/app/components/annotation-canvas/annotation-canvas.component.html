<canvas
  #annotationCanvas
  [width]="pageWidth"
  [height]="pageHeight"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  class="annotation-canvas"
  [class.canvas-interactive]="isCanvasInteractive"
></canvas>
