<div class="hiw-page" [@fadeInOut]>
  <div class="hiw-hero">
    <div class="container mx-auto px-4 text-center">
      <h1>How It Works</h1>
      <p>Create professional sides in minutes with our simple 4-step process.</p>
    </div>
  </div>

  <section class="container mx-auto px-4 py-16">
    <div class="max-w-4xl mx-auto">
      <div class="hiw-step" *ngFor="let step of steps; let i = index">
        <div class="hiw-num">{{ i + 1 }}</div>
        <div class="hiw-copy">
          <h2>{{ step.title }}</h2>
          <p>{{ step.body }}</p>
        </div>
      </div>

      <div class="hiw-cta">
        <h3>Ready to streamline your sides creation?</h3>
        <a routerLink="/" class="btn-sw btn-sw-primary">Get Started Now</a>
      </div>
    </div>
  </section>
</div>
