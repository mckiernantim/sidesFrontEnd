<div class="hiw-page" [@fadeInOut]>
  <section class="sw-hero">
    <div class="sw-hero__overlay"></div>
    <div class="sw-hero__content">
      <h1 class="sw-hero__headline">HOW IT <span class="sw-accent-text">WORKS</span></h1>
      <p class="sw-hero__subhead">Create professional sides in minutes with our simple 4-step process.</p>
    </div>
  </section>

  <section class="container mx-auto px-4 py-16">
    <div class="max-w-4xl mx-auto">
      <div class="hiw-step" *ngFor="let step of steps; let i = index">
        <div class="hiw-num">{{ i + 1 }}</div>
        <div class="hiw-copy">
          <h2>{{ step.title }}</h2>
          <p>{{ step.body }}</p>
        </div>
      </div>

      <div class="hiw-cta">
        <h3>Ready to streamline your sides creation?</h3>
        <a routerLink="/" class="btn-sw btn-sw-primary">Get Started Now</a>
      </div>
    </div>
  </section>
</div>
