<div class="shoot-day-card bg-sw-surface rounded-lg border border-sw-border overflow-hidden">
  <!-- Day Header -->
  <div class="flex items-center justify-between p-4 bg-sw-surface-2 border-b border-sw-border">
    <div>
      <h3 class="text-lg font-bold text-sw-text">{{ dayLabel }}</h3>
      <div *ngIf="day?.primaryLocation" class="text-sm text-sw-text-muted">
        📍 {{ day.primaryLocation }}
      </div>
    </div>
    <div class="flex items-center space-x-4 text-sm">
      <div class="text-center">
        <div class="font-bold text-sw-accent">{{ formattedPageCount }}</div>
        <div class="text-xs text-sw-text-subtle">pages</div>
      </div>
      <div class="text-center">
        <div class="font-bold text-sw-accent">{{ formattedTotalTime }}</div>
        <div class="text-xs text-sw-text-subtle">est. time</div>
      </div>
      <div class="text-center">
        <div class="font-bold text-sw-accent">{{ day?.scenes?.length || 0 }}</div>
        <div class="text-xs text-sw-text-subtle">scenes</div>
      </div>
      <button
        *ngIf="editable"
        (click)="onRemoveDay()"
        class="text-sw-text-subtle hover:text-sw-danger transition-colors ml-2"
        title="Remove shoot day">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Cast Summary and Actions -->
  <div class="px-4 py-2 flex flex-wrap items-center justify-between gap-2 bg-sw-bg border-b border-sw-border">
    <div class="flex flex-wrap items-center gap-2">
      <div class="text-xs text-sw-text-muted">
        {{ castSummary }}
      </div>
      <!-- Show/Hide characters on scene strips (same global setting as Unscheduled panel) -->
      <div class="flex items-center gap-1" role="group" aria-label="Character visibility">
        <span class="text-xs text-sw-text-subtle">Cast:</span>
        <button
          type="button"
          data-testid="day-cast-visibility-show"
          class="text-xs px-2 py-0.5 rounded-md border font-medium transition-colors"
          [ngClass]="showCast
            ? 'bg-sw-accent text-sw-accent-fg border-sw-accent'
            : 'bg-sw-surface-2 text-sw-text-muted border-sw-border'"
          [attr.aria-pressed]="showCast"
          (click)="castVisibilityChange.emit(true)">
          Show
        </button>
        <button
          type="button"
          data-testid="day-cast-visibility-hide"
          class="text-xs px-2 py-0.5 rounded-md border font-medium transition-colors"
          [ngClass]="!showCast
            ? 'bg-sw-accent text-sw-accent-fg border-sw-accent'
            : 'bg-sw-surface-2 text-sw-text-muted border-sw-border'"
          [attr.aria-pressed]="!showCast"
          (click)="castVisibilityChange.emit(false)">
          Hide
        </button>
      </div>
    </div>
    <!-- Generate One-Liners for Day Button -->
    <button
      *ngIf="editable && canGenerateOneLiners"
      (click)="onGenerateDayOneLiners()"
      class="text-xs bg-sw-surface-2 hover:bg-sw-border text-sw-accent border border-sw-accent px-3 py-1 rounded-md transition-colors flex items-center space-x-1"
      [title]="'Generate AI one-liners for ' + scenesReadyForOneLiners + ' scene(s) in this day'">
      <span>🤖</span>
      <span>Generate One-Liners ({{ scenesReadyForOneLiners }})</span>
    </button>
    <div *ngIf="editable && !canGenerateOneLiners && day?.scenes?.length > 0" class="text-xs text-sw-warning italic">
      No scenes ready for AI one-liners
    </div>
  </div>

  <!-- Per-Day Sort Controls (spec 030 US2) -->
  <div
    *ngIf="editable"
    class="px-4 py-2 flex flex-wrap items-center gap-1.5 bg-sw-bg border-b border-sw-border"
    role="group"
    [attr.aria-label]="'Sort ' + dayLabel">
    <span class="text-xs text-sw-text-subtle mr-1">Sort:</span>
    <button
      *ngFor="let opt of sortModes"
      type="button"
      data-testid="day-sort-btn"
      class="sort-btn text-xs px-2 py-0.5 rounded-md border border-sw-border bg-sw-surface-2 text-sw-text-muted hover:bg-sw-border disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
      [class.active]="activeSortMode === opt.mode"
      [disabled]="!canSort"
      [attr.aria-label]="'Sort ' + dayLabel + ' by ' + opt.label"
      (click)="onSort(opt.mode)">
      {{ opt.label }}
    </button>
  </div>

  <!-- Scene List (Drop Zone) -->
  <div
    class="scene-list p-2 min-h-[60px]"
    cdkDropList
    [id]="dropListId"
    [cdkDropListData]="day?.scenes || []"
    [cdkDropListConnectedTo]="connectedDropLists"
    [cdkDropListDisabled]="!editable"
    (cdkDropListDropped)="onSceneDrop($event)">

    <div
      *ngFor="let scene of day?.scenes; trackBy: trackBySceneId"
      cdkDrag
      [cdkDragData]="scene"
      [cdkDragDisabled]="!editable"
      class="mb-2">
      <app-scene-strip
        [scene]="scene"
        [editable]="editable"
        [showTimeline]="true"
        [showOneLiner]="true"
        [showCast]="showCast"
        [castMembers]="castMembers"
        (sceneClicked)="onSceneClicked($event)"
        (removeScene)="onSceneRemoved($event)"
        (timeChanged)="onTimeChanged($event)"
        (oneLinerChanged)="onOneLinerChanged($event)"
        (castVisibilityChange)="castVisibilityChange.emit($event)"
        (headerChanged)="headerChanged.emit($event)">
      </app-scene-strip>
    </div>

    <!-- Empty State -->
    <div
      *ngIf="!day?.scenes?.length"
      class="text-center py-6 text-sw-text-subtle text-sm italic border-2 border-dashed border-sw-border rounded-md">
      Drop scenes here
    </div>
  </div>
</div>
